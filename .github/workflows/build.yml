name: build-and-test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      client:
        description: 'Run the client boot test'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORGE: 1.20.1-47.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate mods
        run: |
          pip install -q pillow
          python3 tools/build.py | tee ci-gen.log

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Compile and build per-mod jars
        id: compile
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew modJars --no-daemon --stacktrace 2>&1 | tee compile.log
          ls -la build/modjars | tee jars.txt

      - name: Cache Forge server
        if: steps.compile.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: server-cache
          key: forge-server-${{ env.FORGE }}

      - name: Server self-test
        id: server
        if: steps.compile.outcome == 'success'
        run: bash ci/server_test.sh

      - name: Client self-test
        id: client
        if: always() && steps.compile.outcome == 'success' && (github.event_name == 'push' || github.event.inputs.client == 'true')
        run: bash ci/client_test.sh

      - name: Report
        if: always()
        run: python3 ci/report.py

      - name: Publish report
        if: always()
        run: |
          set -e
          cd ci-report
          git init -q -b ci-results
          git config user.name "frontierworks-ci"
          git config user.email "ci@frontierworks.invalid"
          git add -A
          git commit -q -m "CI report for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Upload jars
        if: always() && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: frontierworks-mods
          path: build/modjars/*.jar
          retention-days: 7
