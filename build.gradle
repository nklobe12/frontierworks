plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

// Every mod lives in mods/<modid>/ : hand-written Java in src/, generated Java in gen/,
// generated + static resources in resources/. The list (in load order) is mods.txt,
// written by tools/build.py. All Java compiles once; jar_<modid> tasks then split the
// reobfuscated jar into one jar per mod.
def modIds = file('mods.txt').readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }
def pkgOf = { String id -> id.startsWith('fw_') ? id.substring(3) : id }

version = project.pack_version
group = 'com.frontierworks'
base { archivesName = 'frontierworks-all' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main {
        java { srcDirs = modIds.collectMany { ["mods/${it}/src", "mods/${it}/gen"] } }
        resources { srcDirs = ['generated/merged'] }
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                frontierworks {
                    source sourceSets.main
                }
            }
        }
        client {
            if (project.hasProperty('fwSelftest')) {
                property 'fwcore.selftest', 'client'
            }
            if (project.hasProperty('fwShowcase')) {
                property 'fwcore.showcase', 'true'
                args '--quickPlaySingleplayer', 'showcase', '--width', '1280', '--height', '720'
            }
        }
        server {
            args '--nogui'
            if (project.hasProperty('fwSelftest')) {
                property 'fwcore.selftest', 'server'
            }
        }
    }
}

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'frontierworks',
            'Specification-Vendor'    : 'Frontierworks',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'frontierworks-all',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Frontierworks'
        ])
    }
    finalizedBy 'reobfJar'
}

def splitTasks = []
modIds.each { id ->
    def pkg = pkgOf(id)
    def t = tasks.register("jar_${id}", Jar) {
        group = 'frontierworks'
        dependsOn 'reobfJar'
        archiveFileName = "${id}-${project.minecraft_version}-${project.version}.jar"
        destinationDirectory = layout.buildDirectory.dir('modjars')
        from({ zipTree(tasks.named('jar', Jar).get().archiveFile.get().asFile) }) {
            include "com/frontierworks/${pkg}/**"
        }
        from("mods/${id}/resources")
        manifest {
            attributes([
                'Specification-Title'     : id,
                'Specification-Vendor'    : 'Frontierworks',
                'Specification-Version'   : '1',
                'Implementation-Title'    : id,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Frontierworks'
            ])
        }
    }
    splitTasks << t
}

tasks.register('modJars') {
    group = 'frontierworks'
    description = 'Builds one jar per Frontierworks mod into build/modjars'
    dependsOn splitTasks
}

tasks.named('build').configure { dependsOn 'modJars' }
